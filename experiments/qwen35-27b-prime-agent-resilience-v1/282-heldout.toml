# Disjoint observable fault-recovery slice (6 tasks).

model = "Qwen/Qwen3.5-27B"
num_tasks = 6
num_rollouts = 1
shuffle = false
max_concurrent = 3
verbose = false
rich = false
server = false
push = false

[env]
max_concurrent_agents = 2

[env.taskset]
id = "prime-agent-resilience-v1"
split = "heldout"
families = ["malformed_result_repair", "delayed_result", "message_type_repair"]
instances_per_family = 1
instance_offset = 1000
seed = 20260815

[env.agent]
max_turns = 24
max_output_tokens = 24576
max_total_tokens = 98304

[env.agent.harness]
id = "prime_agent"
version = "0.7.2-beta.495.1.97b994c"

[env.agent.runtime]
type = "docker"
image = "python:3.11-slim"

[env.agent.timeout]
setup = 300.0
rollout = 1200.0
finalize = 60.0
scoring = 60.0

[client]
base_url = "http://127.0.0.1:8100/v1"
api_key_var = "PRIME_API_KEY"
type = "eval"

[sampling]
temperature = 0.4
reasoning_effort = "high"
max_tokens = 4096
