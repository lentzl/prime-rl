# Zero-learning-rate mechanism audit for the isolated specialist router.

max_steps = 1
seq_len = 2048
max_train_batch_lead = 0
output_dir = "/home/ubuntu/rlm/outputs/q35-2b-specialist-router-outcome-grpo-c1f-v1"
clean = false

[run]
name = "c1f-zero-lr-audit"
dir = "c1f-zero-lr-audit"

[deployment]
gpus_per_node = 2
num_train_gpus = 1
num_infer_gpus = 1

[model]
name = "/home/ubuntu/rlm/outputs/q35-2b-adaptive-cognition-sft-v1/c54-step8-action4-adaptive-nonroot-step2-v4/weights/step_2"

[trainer]
enable_token_export = true

[trainer.model]
seq_len = 2048
attn = "auto"
impl = "custom"
fsdp_cpu_offload = false
optim_cpu_offload = false

[trainer.model.compile]
fullgraph = false

[trainer.model.ac]
mode = "full"
freq = 1
targets = ["norm"]

[trainer.optim]
type = "adamw"
lr = 0.0
weight_decay = 0.01
max_norm = 1.0
betas1 = 0.9
betas2 = 0.999

[trainer.scheduler]
type = "constant"

[orchestrator]
batch_size = 8
group_size = 8
max_inflight_episodes = 8
oversampling_factor = 1.0
max_off_policy_steps = 0

[orchestrator.algo]
type = "grpo"

[[orchestrator.pre_batch_filters]]
type = "trainable_token_window"
max_tokens = 2048
enforce = true

[[orchestrator.pre_batch_filters]]
type = "zero_advantage"
enforce = false

[[orchestrator.pre_batch_filters]]
type = "gibberish"
enforce = false

[[orchestrator.pre_batch_filters]]
type = "repetition"
enforce = false

[orchestrator.renderer]
name = "qwen3.5"
enable_thinking = false

[orchestrator.train.sampling]
temperature = 1.0
reasoning_effort = "high"
max_completion_tokens = 128

[orchestrator.train.sampling.extra_body]
top_k = -1
min_p = 0.0
return_token_ids = true

[[orchestrator.train.source]]
name = "specialist-router-outcome"
ratio = 1.0
group_size = 8

[orchestrator.train.source.algo]
type = "grpo"

[orchestrator.train.source.env.taskset]
id = "specialist-router-v1"
split = "train"
count = 96
start_index = 39000

[orchestrator.train.source.env.agent]
max_turns = 1
max_output_tokens = 256
max_total_tokens = 2048

[orchestrator.train.source.env.agent.harness]
id = "null"

[orchestrator.train.source.env.agent.runtime]
type = "subprocess"

[orchestrator.train.source.serve]
max_concurrent = 8

[orchestrator.train.source.serve.pool]
type = "static"
num_workers = 1

[inference]
backend_port = 8100

[inference.server]
port = 8000
liveness_timeout_seconds = 30.0

[inference.vllm]
max_model_len = 4096
language_model_only = true
enforce_eager = true
tensor_parallel_size = 1
data_parallel_size = 1
data_parallel_rpc_port = 13345
gpu_memory_utilization = 0.42
kv_cache_memory_bytes = 4294967296
max_num_seqs = 8
max_num_batched_tokens = 2048
mamba_ssm_cache_dtype = "float32"

[file_monitor]
filename = "metrics.jsonl"

[log]
json_logging = false
