# Conditional one-step full-dense update. This file differs from the zero-LR
# audit only in its unique outputs, positive LR, enforced variance filter, and
# write-once checkpoint blocks.

max_steps = 1
seq_len = 8192
max_train_batch_lead = 0
output_dir = "/home/ubuntu/rlm/outputs/q35-2b-source-first-call-s6-v1/step1"
clean = false

[run]
name = "source-first-call-s6-step1"
dir = "source-first-call-s6-step1"

[deployment]
gpus_per_node = 2
num_train_gpus = 1
num_infer_gpus = 1

[model]
name = "/home/ubuntu/rlm/outputs/q35-2b-source-worker-remedial-s5-v1/h-source-s5-remedial-step8-v1/weights/step_8"

[trainer]
enable_token_export = true

[trainer.model]
seq_len = 8192
attn = "auto"
impl = "custom"
fsdp_cpu_offload = false
optim_cpu_offload = false

[trainer.model.compile]
fullgraph = false

[trainer.model.ac]
mode = "full"
freq = 1
targets = ["norm"]

[trainer.loss]
type = "default"
kl_tau = 0.001

[trainer.optim]
type = "adamw"
lr = 1e-6
weight_decay = 0.01
max_norm = 1.0
betas1 = 0.9
betas2 = 0.999

[trainer.scheduler]
type = "constant"

[trainer.ckpt]
interval = 1
keep_last = 1
weights_only = true

[trainer.ckpt.weights]
save_sharded = true
save_format = "safetensors"

[orchestrator]
batch_size = 16
group_size = 8
max_inflight_episodes = 16
oversampling_factor = 1.0
max_off_policy_steps = 0
max_train_batch_lead = 0

[orchestrator.batch_source_minimums]
source-worker-ast-s6 = 8
source-worker-config-s6 = 8

[orchestrator.algo]
type = "grpo"
sampled_session_scope = "non_root"

[[orchestrator.pre_batch_filters]]
type = "trainable_token_window"
max_tokens = 8192
enforce = true

[[orchestrator.pre_batch_filters]]
type = "gibberish"
enforce = false

[[orchestrator.pre_batch_filters]]
type = "repetition"
enforce = false

[[orchestrator.pre_batch_filters]]
type = "zero_advantage"
enforce = true

[[orchestrator.post_batch_filters]]
type = "gibberish"
enforce = false

[[orchestrator.post_batch_filters]]
type = "repetition"
enforce = false

[[orchestrator.post_batch_filters]]
type = "zero_advantage"
enforce = true

[orchestrator.renderer]
name = "qwen3.5"
enable_thinking = true

[orchestrator.train.sampling]
temperature = 1.0
reasoning_effort = "high"
max_completion_tokens = 2048

[orchestrator.train.sampling.extra_body]
top_k = -1
min_p = 0.0
return_token_ids = true

[[orchestrator.train.source]]
name = "source-worker-ast-s6"
ratio = 1.0
group_size = 8

[orchestrator.train.source.algo]
type = "grpo"
sampled_session_scope = "non_root"

[orchestrator.train.source.env]
max_concurrent_agents = 2

[orchestrator.train.source.env.taskset]
id = "source-worker-first-call-v1"
split = "train"
families = ["specialist_source_ast"]
instruction_level = "standard"
instances_per_template = 8
instance_offset = 70000
seed = 20270909
available_experts = ["generic_worker", "table_analyst", "source_inspector"]
specialist_relative_costs = { generic_worker = 0.5, table_analyst = 1.0, source_inspector = 1.0 }

[orchestrator.train.source.env.taskset.task]
reward_mode = "source_worker_first_call"

[orchestrator.train.source.env.agent]
max_turns = 8
max_output_tokens = 12288
max_total_tokens = 49152

[orchestrator.train.source.env.agent.harness]
id = "prime_agent"
version = "0.7.2-beta.495.1.97b994c"
autonomous = true
gates = ["python /workspace/.subagent-communication/completion_gate.py"]
autonomous_max_continuations = 2
autonomous_max_turns = 8
autonomous_max_tokens = 49152
autonomous_timeout_ms = 900000
process_timeout_ms = 840000

[orchestrator.train.source.env.agent.harness.env]
RLM_MAX_DEPTH = "2"

[orchestrator.train.source.env.agent.runtime]
type = "docker"
image = "rlm-prime-agent-runtime:0.7.2-beta.495.1.97b994c-node22.19.0-default-parent-v1"

[orchestrator.train.source.env.agent.timeout]
setup = 300.0
rollout = 900.0
finalize = 60.0
scoring = 60.0

[orchestrator.train.source.env.agent.retries]
max_retries = 0

[orchestrator.train.source.serve]
max_concurrent = 2

[orchestrator.train.source.serve.pool]
type = "static"
num_workers = 1

[[orchestrator.train.source]]
name = "source-worker-config-s6"
ratio = 1.0
group_size = 8

[orchestrator.train.source.algo]
type = "grpo"
sampled_session_scope = "non_root"

[orchestrator.train.source.env]
max_concurrent_agents = 2

[orchestrator.train.source.env.taskset]
id = "source-worker-first-call-v1"
split = "train"
families = ["specialist_source_config"]
instruction_level = "standard"
instances_per_template = 8
instance_offset = 70000
seed = 20270909
available_experts = ["generic_worker", "table_analyst", "source_inspector"]
