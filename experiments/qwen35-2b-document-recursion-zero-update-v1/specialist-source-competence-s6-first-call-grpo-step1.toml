[orchestrator.train.source.env.agent.timeout]
setup = 300.0
rollout = 900.0
finalize = 60.0
scoring = 60.0

[orchestrator.train.source.env.agent.retries]
max_retries = 0

[orchestrator.train.source.serve]
max_concurrent = 2

[orchestrator.train.source.serve.pool]
type = "static"
num_workers = 1

[orchestrator.ckpt]
interval = 1
keep_last = 1
wait_for_weights_timeout = 3600

[inference]
backend_port = 8100

[inference.server]
port = 8000
liveness_timeout_seconds = 30.0

[inference.router]
type = "role-router"
policy_role = "child"
anchor_model = "/home/ubuntu/rlm/outputs/q35-2b-adaptive-cognition-sft-v1/c54-step8-action4-adaptive-nonroot-step2-v4/weights/step_2"
anchor_backend_port = 8200
anchor_data_parallel_rpc_port = 13347
anchor_gpu_memory_utilization = 0.34
anchor_kv_cache_memory_bytes = 4294967296
leak_coordinator_exact_action = false
leak_child_exact_action = false
strip_child_tool_choice = true
