# Full-weight hard-GRPO rung update for executable Prime Agent actions.

max_steps = 4
seq_len = 8192
max_train_batch_lead = 0
output_dir = "/ephemeral/outputs/qwen35-27b-procedural-harness-action-ramp-v1"
clean = true

[run]
name = "atomic-state-grpo"
dir = "atomic-state-grpo"

[deployment]
gpus_per_node = 8
num_train_gpus = 6
num_infer_gpus = 2

[model]
name = "Qwen/Qwen3.5-27B"

[trainer.model]
seq_len = 8192
attn = "auto"
impl = "custom"
optimization_dtype = "bfloat16"
reduce_dtype = "bfloat16"
fsdp_cpu_offload = true
optim_cpu_offload = false
reshard_after_forward = true
fused_lm_head_token_chunk_size = "disabled"

[trainer.model.compile]
fullgraph = false

[trainer.model.ac]
mode = "full"
freq = 1
targets = ["norm"]

[trainer.model.ac_offloading]
pin_memory = true
max_inflight_activations = 5

[trainer.optim]
type = "adamw"
lr = 5e-7
weight_decay = 0.01
max_norm = 1.0
betas1 = 0.9
betas2 = 0.999

[trainer.scheduler]
type = "constant"

[trainer.ckpt]
interval = 1
keep_last = 4
weights_only = true

[trainer.ckpt.weights]
save_sharded = true
save_format = "safetensors"

[orchestrator]
batch_size = 16
group_size = 8
max_inflight_episodes = 8
oversampling_factor = 0.5
max_off_policy_steps = 0

[orchestrator.algo]
type = "grpo"

[[orchestrator.pre_batch_filters]]
type = "trainable_token_window"
max_tokens = 8192
enforce = true

[[orchestrator.pre_batch_filters]]
type = "zero_advantage"
enforce = true

[[orchestrator.pre_batch_filters]]
type = "gibberish"
enforce = false

[[orchestrator.pre_batch_filters]]
type = "repetition"
enforce = false

[orchestrator.renderer]
name = "qwen3.5"
enable_thinking = true

[orchestrator.train.sampling]
temperature = 1.0
reasoning_effort = "high"
max_completion_tokens = 1536

[orchestrator.train.sampling.extra_body]
top_k = -1
min_p = 0.0
return_token_ids = true

[[orchestrator.train.source]]
name = "procedural-harness-action-ramp"
ratio = 1.0
group_size = 8

[orchestrator.train.source.algo]
type = "grpo"

[orchestrator.train.source.env]
max_concurrent_agents = 8

[orchestrator.train.source.env.taskset]
id = "procedural-harness-master-v1"
split = "train_gen"
count = 512
start_index = 1000000
master_seed = 20260816
curriculum_rung = "atomic_state"

[orchestrator.train.source.env.agent]
max_turns = 16
max_output_tokens = 16384
max_total_tokens = 65536

[orchestrator.train.source.env.agent.harness]
id = "prime_agent"
version = "0.7.2-beta.495.1.97b994c"
autonomous = true
gates = ["python /workspace/.procedural-harness-master/completion_gate.py"]
autonomous_max_continuations = 4
autonomous_max_turns = 16
autonomous_max_tokens = 65536
autonomous_timeout_ms = 900000

[orchestrator.train.source.env.agent.runtime]
type = "docker"
image = "python:3.11-slim"

[orchestrator.train.source.env.agent.timeout]
setup = 300.0
rollout = 900.0
finalize = 60.0
scoring = 60.0

[orchestrator.train.source.env.agent.retries]
max_retries = 0

[orchestrator.train.source.serve.pool]
type = "elastic"
multiplex = 128

[orchestrator.ckpt]
interval = 1
keep_last = 4
wait_for_weights_timeout = 3600

[inference]
backend_port = 8100

[inference.server]
port = 8000
liveness_timeout_seconds = 30.0

[inference.vllm]
max_model_len = 32768
enforce_eager = true
tool_call_parser = "qwen3_coder"
reasoning_parser = "qwen3"
tensor_parallel_size = 2
data_parallel_size = 1
data_parallel_rpc_port = 13345
gpu_memory_utilization = 0.80
max_num_seqs = 16
mamba_ssm_cache_dtype = "float32"

[file_monitor]
filename = "metrics.jsonl"

[log]
json_logging = false
