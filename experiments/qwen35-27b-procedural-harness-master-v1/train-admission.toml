model = "Qwen/Qwen3.5-27B"
num_tasks = 6
num_rollouts = 8
shuffle = false
max_concurrent = 4
verbose = false
rich = false
server = false
push = false

[env]
max_concurrent_agents = 4

[env.taskset]
id = "procedural-harness-master-v1"
split = "train_gen"
count = 6
start_index = 100000
master_seed = 20260816

[env.agent]
max_turns = 32
max_output_tokens = 32768
max_total_tokens = 131072

[env.agent.harness]
id = "prime_agent"
version = "0.7.2-beta.495.1.97b994c"

[env.agent.runtime]
type = "docker"
image = "python:3.11-slim"

[env.agent.timeout]
setup = 300.0
rollout = 1800.0
finalize = 60.0
scoring = 60.0

[client]
base_url = "http://127.0.0.1:8100/v1"
api_key_var = "PRIME_API_KEY"
type = "eval"

[sampling]
temperature = 1.0
reasoning_effort = "high"
max_tokens = 4096
