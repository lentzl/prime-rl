# One-step, zero-learning-rate audit of mixed typed-feedback SDPO and GRPO.

max_steps = 1
seq_len = 8192
max_train_batch_lead = 0
output_dir = "/ephemeral/outputs/qwen35-27b-prime-agent-sdpo-v1"
clean = true

[run]
name = "zero-lr-audit"
dir = "zero-lr-audit"

[deployment]
gpus_per_node = 8
num_train_gpus = 6
num_infer_gpus = 2

[model]
name = "Qwen/Qwen3.5-27B"

[trainer]
enable_token_export = true

[trainer.model]
seq_len = 8192
attn = "auto"
impl = "custom"
optimization_dtype = "bfloat16"
reduce_dtype = "bfloat16"
fsdp_cpu_offload = true
optim_cpu_offload = false
reshard_after_forward = true
fused_lm_head_token_chunk_size = "disabled"

[trainer.model.compile]
fullgraph = false

[trainer.model.ac]
mode = "full"
freq = 1
targets = ["norm"]

[trainer.model.ac_offloading]
pin_memory = true
max_inflight_activations = 5

[trainer.sdpo_loss]
distillation_topk = 20
alpha = 1.0
is_clip = 2.0
rollout_is = "token"
rollout_is_threshold = 2.0
teacher_regularization = "ema"
teacher_update_rate = 0.01

[trainer.optim]
type = "adamw"
lr = 0.0
weight_decay = 0.01
max_norm = 1.0
betas1 = 0.9
betas2 = 0.999

[trainer.scheduler]
type = "constant"

[orchestrator]
batch_size = 16
group_size = 1
max_inflight_episodes = 8
oversampling_factor = 0.5
max_off_policy_steps = 0

[orchestrator.batch_source_minimums]
ownership-child-diagnostic-sdpo = 4
ownership-coordinator-retention = 2
communication-direct-retention = 2
communication-single-retention = 2
communication-parallel-retention = 2
communication-causal-retention = 4

[orchestrator.algo]
type = "grpo"

[[orchestrator.pre_batch_filters]]
type = "trainable_token_window"
max_tokens = 8192
enforce = true

[[orchestrator.pre_batch_filters]]
type = "gibberish"
enforce = false

[[orchestrator.pre_batch_filters]]
type = "repetition"
enforce = false

[[orchestrator.pre_batch_filters]]
type = "zero_advantage"
enforce = false

[[orchestrator.post_batch_filters]]
type = "gibberish"
enforce = false

[[orchestrator.post_batch_filters]]
type = "repetition"
enforce = false

[[orchestrator.post_batch_filters]]
type = "zero_advantage"
enforce = false

[orchestrator.renderer]
name = "qwen3.5"
enable_thinking = true

[orchestrator.train.sampling]
temperature = 1.0
reasoning_effort = "high"
max_completion_tokens = 1024

[orchestrator.train.sampling.extra_body]
top_k = -1
min_p = 0.0
return_token_ids = true

[[orchestrator.train.source]]
name = "ownership-child-diagnostic-sdpo"
ratio = 4.0
group_size = 1

[orchestrator.train.source.algo]
type = "sdpo"
success_reward_threshold = 2.0
dont_reprompt_on_self_success = true
include_environment_feedback = true
require_explicit_feedback = true
required_feedback_contract_schema = "prime-agent/ownership-decision-feedback/v1"
environment_feedback_only_without_solution = true
multi_turn_replay = true
max_reprompt_len = 10240

[orchestrator.train.source.algo.filter]
import_path = "subagent_communication_v1.taskset.keep_first_coordinator_tool_call"

[orchestrator.train.source.algo.renderer]
name = "qwen3.5"
enable_thinking = true

[orchestrator.train.source.env]
max_concurrent_agents = 1

[orchestrator.train.source.env.taskset]
id = "ownership-invariant-v1"
split = "admission"
ownership = "child"
yield_policy = "semantic"
instruction_level = "standard"
record_causal_feedback = true
instances_per_family = 4
instance_offset = 15000
seed = 20260815

[orchestrator.train.source.env.taskset.task]
yield_policy = "semantic"
reward_shape = "strict"

[orchestrator.train.source.env.agent]
max_turns = 8
max_output_tokens = 8192
max_total_tokens = 24576

[orchestrator.train.source.env.agent.harness]
id = "prime_agent"
version = "0.7.2-beta.495.1.97b994c"

[orchestrator.train.source.env.agent.runtime]
type = "docker"
image = "python:3.11-slim"

[orchestrator.train.source.env.agent.timeout]
setup = 300.0
rollout = 600.0
finalize = 60.0
scoring = 60.0

[orchestrator.train.source.env.agent.retries]
max_retries = 0

[orchestrator.train.source.serve.pool]
type = "elastic"
multiplex = 128

[[orchestrator.train.source]]
name = "ownership-coordinator-retention"
ratio = 2.0
group_size = 2

[orchestrator.train.source.algo]
type = "grpo"

[orchestrator.train.source.env]
max_concurrent_agents = 1

