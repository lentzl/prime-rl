# Observable official Prime Agent foundation slice (10 tasks).

model = "Qwen/Qwen3.5-27B"
num_tasks = 10
num_rollouts = 1
shuffle = false
max_concurrent = 2
verbose = false
rich = false
server = false
push = false

[env]
max_concurrent_agents = 1

[env.taskset]
id = "prime-agent-foundations-v2"
families = ["ipython_cell", "kernel_persistence", "conversation_resume", "child_result_delivery", "child_cancellation"]
instances_per_family = 2
instance_offset = 0

[env.agent]
max_turns = 12
max_output_tokens = 12288
max_total_tokens = 32768

[env.agent.harness]
id = "prime_agent"
version = "0.7.2-beta.495.1.97b994c"

[env.agent.runtime]
type = "docker"
image = "python:3.11-slim"

[env.agent.timeout]
setup = 300.0
rollout = 600.0
finalize = 60.0
scoring = 60.0

[client]
base_url = "http://127.0.0.1:8100/v1"
api_key_var = "PRIME_API_KEY"
type = "eval"

[sampling]
temperature = 0.4
reasoning_effort = "high"
max_tokens = 4096
