# Rung 4: repair live Python and document API failures without losing notebook state.

max_steps = 24
seq_len = 32768
output_dir = "/ephemeral/ipython-rungs/outputs/04-recovery-rl"
clean_output_dir = true

[deployment]
gpus_per_node = 1
num_train_gpus = 1
num_infer_gpus = 0

[weight_broadcast]
type = "filesystem"

[ckpt]
interval = 4
keep_last = 2
keep_interval = 12

[file_monitor]
filename = "metrics.jsonl"

[model]
name = "/ephemeral/models/qwen35-ipython-foundations-r1"

[model.vlm]
vision_encoder_attr = "model.visual"
language_model_attr = "model.language_model"
freeze_vision_encoder = true

[trainer.model]
impl = "custom"
optimization_dtype = "bfloat16"
reduce_dtype = "bfloat16"

[trainer.model.ac]
freq = 1

[trainer.model.lora]
rank = 16
alpha = 32

[trainer.optim]
lr = 1e-5

[orchestrator]
batch_size = 8
group_size = 4

[orchestrator.algo]
type = "grpo"

[orchestrator.renderer]
name = "qwen3.5"
enable_thinking = false

[orchestrator.model.client]
base_url = ["http://127.0.0.1:8000/v1"]
admin_base_url = ["http://127.0.0.1:8100/v1"]

[orchestrator.train.sampling]
temperature = 0.8
max_completion_tokens = 2048

[[orchestrator.train.source]]
name = "prime-agent-ipython-recovery"

[orchestrator.train.source.env.taskset]
id = "ipython-foundations-v1"
split = "train"
families = ["recovery", "document_recovery"]
instruction_level = "guided"
instances_per_template = 4

[orchestrator.train.source.env.agent]
max_turns = 16
max_output_tokens = 12288
max_total_tokens = 32768

[orchestrator.train.source.env.agent.timeout]
setup = 300.0
rollout = 600.0
finalize = 60.0
scoring = 60.0

[orchestrator.train.source.env.agent.harness]
id = "prime-agent"
version = "0.7.0"
save_session = true
max_depth = 0

[orchestrator.train.source.env.agent.runtime]
type = "docker"
image = "python:3.11-slim"

[orchestrator.train.source.serve.pool]
type = "static"
num_workers = 1

[orchestrator.train.source.serve]
max_concurrent = 2
