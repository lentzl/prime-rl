# Rung 2: accept a silent assignment, use the variable, then answer.

max_steps = 4
seq_len = 12288
output_dir = "/ephemeral/ipython-rungs/outputs/02-assignment"
clean_output_dir = true

[deployment]
gpus_per_node = 1
num_train_gpus = 1
num_infer_gpus = 0

[weight_broadcast]
type = "filesystem"

[ckpt]
interval = 4
keep_last = 1
keep_interval = 4

[file_monitor]
filename = "metrics.jsonl"

[model]
name = "/ephemeral/ipython-rungs/outputs/01-completion/weights/step_4"

[model.vlm]
vision_encoder_attr = "model.visual"
language_model_attr = "model.language_model"
freeze_vision_encoder = true

[trainer.model]
impl = "custom"
optimization_dtype = "bfloat16"
reduce_dtype = "bfloat16"

[trainer.model.ac]
freq = 1

[trainer.model.lora]
rank = 16
alpha = 32

[trainer.optim]
lr = 1e-5

[trainer.sdpo_loss]
teacher_regularization = "live-policy"
distillation_topk = 20
alpha = 1.0

[orchestrator]
batch_size = 12
group_size = 1

[orchestrator.algo]
type = "opsd"
demo_key = "demonstration"

[orchestrator.algo.renderer]
name = "qwen3.5"

[orchestrator.renderer]
name = "qwen3.5"
enable_thinking = false

[orchestrator.model.client]
base_url = ["http://127.0.0.1:8000/v1"]
admin_base_url = ["http://127.0.0.1:8100/v1"]

[orchestrator.train.sampling]
temperature = 0.8
max_completion_tokens = 768

[[orchestrator.train.source]]
name = "prime-agent-ipython-assignment"

[orchestrator.train.source.env.taskset]
id = "ipython-foundations-v1"
split = "train"
families = ["assignment"]
instruction_level = "standard"
instances_per_template = 4
rounds_per_task = 1

[orchestrator.train.source.env.agent]
max_turns = 6
max_output_tokens = 4096
max_total_tokens = 12288

[orchestrator.train.source.env.agent.timeout]
setup = 300.0
rollout = 600.0
finalize = 60.0
scoring = 60.0

[orchestrator.train.source.env.agent.harness]
id = "prime-agent"
version = "0.7.0"
save_session = true
max_depth = 0

[orchestrator.train.source.env.agent.runtime]
type = "docker"
image = "python:3.11-slim"

[orchestrator.train.source.serve.pool]
type = "static"
num_workers = 1

[orchestrator.train.source.serve]
max_concurrent = 3
