# Feedback-conditioned SDPO plus persistent learnable novelty on the multi-turn
# alphabet-sort env. The EMA self-teacher supplies hindsight corrections; a
# ridge readout observes detached policy states.
#   uv run rl @ configs/debug/algo/sdpo_model_observer.toml

max_steps = 2
seq_len = 4096

[model]
name = "PrimeIntellect/Qwen3-0.6B-Reverse-Text-SFT"

[wandb]
project = "algorithms-debug"
name = "debug-sdpo-model-observer"

[orchestrator]
batch_size = 8
group_size = 4

[orchestrator.algo]
type = "sdpo"
multi_turn_replay = true

[orchestrator.algo.novelty]
weight = 0.1

[orchestrator.algo.renderer]
name = "qwen3"
thinking_retention = "all"

[orchestrator.renderer]
name = "qwen3"
thinking_retention = "all"

[orchestrator.train.sampling]
temperature = 1.0
max_completion_tokens = 512

[[orchestrator.train.env]]
name = "alphabet-sort"
env.taskset = { id = "alphabet-sort-v1", min_turns = 3, max_turns = 5, task = { power_per_turn = false } }
env.agent.harness = { id = "null" }
env.agent.runtime = { type = "subprocess" }

[trainer.sdpo_loss]
distillation_topk = 20
alpha = 1.0
teacher_regularization = "ema"
teacher_update_rate = 0.01

[trainer.model_observer]
feature_dim = 64
ridge_lambda = 0.3
code_resolution = 1.0
correction_scale = 1.0
advantage_clip = 5.0
positive_only = false

[trainer.optim]
type = "adamw"
lr = 1e-6
max_norm = 1.0

[ckpt]
interval = 1

[inference]
gpu_memory_utilization = 0.5
