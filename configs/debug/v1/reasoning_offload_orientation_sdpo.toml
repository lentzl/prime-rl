# Feedback-conditioned SDPO over multi-turn RLM orientation trajectories.
# This is the first curriculum stage: learn when to answer directly and when
# to externalize inspection, state, reusable computation, verification, and
# repair into the IPython environment.
#   uv run rl @ configs/debug/v1/reasoning_offload_orientation_sdpo.toml

output_dir = "outputs/reasoning-offload-orientation-sdpo"
max_steps = 24
seq_len = 4096
max_train_batch_lead = 0

[deployment]
num_train_gpus = 1
num_infer_gpus = 1

[weight_broadcast]
type = "filesystem"

[model]
name = "Qwen/Qwen3-4B-Instruct-2507"

[wandb]
project = "reasoning-offload"
name = "qwen3-4b-instruct-orientation-sdpo"

[ckpt]
interval = 6
keep_last = 2

[orchestrator.ckpt]
wait_for_weights_timeout = 1200

[orchestrator]
batch_size = 4
group_size = 4
max_inflight_rollouts = 4

[orchestrator.algo]
type = "sdpo"
multi_turn_replay = true

[orchestrator.algo.renderer]
name = "qwen3"
# This checkpoint's native Instruct template has no forced thinking prefix.
enable_thinking = true

[orchestrator.renderer]
name = "qwen3"
enable_thinking = true

[orchestrator.train.sampling]
temperature = 1.0
max_completion_tokens = 512

[[orchestrator.train.env]]
name = "orientation-prerequisites"
taskset = { id = "reasoning-offload-orientation-v1", split = "train", families = ["direct", "inspection", "state", "helper", "verification"], instances_per_template = 4 }
harness = { id = "rlm", version = "9017836", runtime = { type = "subprocess" } }
max_turns = 12
max_total_tokens = 4096
timeout = { setup = 300, rollout = 900, finalize = 60, scoring = 60 }

[orchestrator.eval]
interval = 8
num_examples = -1
group_size = 1

[orchestrator.eval.sampling]
temperature = 0.0
max_completion_tokens = 512

[[orchestrator.eval.env]]
name = "orientation-holdout"
taskset = { id = "reasoning-offload-orientation-v1", split = "eval", instances_per_template = 1 }
harness = { id = "rlm", version = "9017836", runtime = { type = "subprocess" } }
max_turns = 12
max_total_tokens = 4096
timeout = { setup = 300, rollout = 900, finalize = 60, scoring = 60 }

[trainer.sdpo_loss]
distillation_topk = 20
alpha = 1.0
teacher_regularization = "ema"
teacher_update_rate = 0.01

[trainer.optim]
type = "adamw"
lr = 1e-6
weight_decay = 0.01
max_norm = 1.0

[trainer.scheduler]
type = "constant"

[trainer.model]
optimization_dtype = "bfloat16"
reduce_dtype = "bfloat16"
fsdp_cpu_offload = false
optim_cpu_offload = true

[inference]
gpu_memory_utilization = 0.8

[inference.model]
dtype = "bfloat16"
max_model_len = 4096
enforce_eager = true
