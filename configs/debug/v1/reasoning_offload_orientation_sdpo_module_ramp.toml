# Feedback-conditioned SDPO for the provided-module reuse prerequisite.
# The larger rollout group follows the paper's rich-feedback setting while
# keeping one synthetic task per update on a two-GPU development machine.
#   uv run rl @ configs/debug/v1/reasoning_offload_orientation_sdpo_module_ramp.toml
# Continue from a prior HF-compatible weight checkpoint with:
#   uv run rl @ ... --model.name /path/to/weights/step_N

output_dir = "outputs/reasoning-offload-orientation-sdpo-module-ramp"
max_steps = 32
seq_len = 4096
max_train_batch_lead = 0

[deployment]
num_train_gpus = 1
num_infer_gpus = 1

[weight_broadcast]
type = "filesystem"

[model]
name = "Qwen/Qwen3-4B-Instruct-2507"

[wandb]
project = "reasoning-offload"
name = "qwen3-4b-instruct-orientation-sdpo-module-ramp"

[ckpt]
interval = 8
keep_last = 2

[orchestrator.ckpt]
wait_for_weights_timeout = 1200

[orchestrator]
batch_size = 8
group_size = 8
max_inflight_rollouts = 8

[orchestrator.algo]
type = "sdpo"
multi_turn_replay = true
max_reprompt_len = 3584

[orchestrator.algo.renderer]
name = "qwen3"
enable_thinking = true

[orchestrator.renderer]
name = "qwen3"
enable_thinking = true

[orchestrator.train.sampling]
temperature = 1.0
max_completion_tokens = 512

[[orchestrator.train.env]]
name = "orientation-module-ramp"
taskset = { id = "reasoning-offload-orientation-v1", split = "train", families = ["module"], instances_per_template = 8 }
harness = { id = "rlm", version = "9017836", runtime = { type = "subprocess" } }
max_turns = 8
max_total_tokens = 4096
timeout = { setup = 300, rollout = 900, finalize = 60, scoring = 60 }

[orchestrator.eval]
interval = 8
num_examples = -1
group_size = 1

[orchestrator.eval.sampling]
temperature = 0.0
max_completion_tokens = 512

[[orchestrator.eval.env]]
name = "orientation-holdout"
taskset = { id = "reasoning-offload-orientation-v1", split = "eval", instances_per_template = 2 }
harness = { id = "rlm", version = "9017836", runtime = { type = "subprocess" } }
max_turns = 12
max_total_tokens = 4096
timeout = { setup = 300, rollout = 900, finalize = 60, scoring = 60 }

[trainer.sdpo_loss]
distillation_topk = 20
alpha = 1.0
teacher_regularization = "ema"
teacher_update_rate = 0.01

[trainer.optim]
type = "adamw"
lr = 1e-6
weight_decay = 0.01
max_norm = 1.0

[trainer.scheduler]
type = "constant"

[trainer.model]
optimization_dtype = "bfloat16"
reduce_dtype = "bfloat16"
fsdp_cpu_offload = true
optim_cpu_offload = false

[inference]
gpu_memory_utilization = 0.8

[inference.model]
dtype = "bfloat16"
max_model_len = 4096
enforce_eager = true
