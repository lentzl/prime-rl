# Second fresh paired confirmation after the first clean step-24 completion.

model = "qwen35-4b-run100-step8"
num_tasks = 4
num_rollouts = 2
shuffle = false
max_concurrent = 2
verbose = false
rich = false
server = false
push = false

[env]
max_concurrent_agents = 4

[env.retries]
max_retries = 1

[env.taskset]
id = "subagent-admission-v1"
system_prompt = "configs/debug/subagent-communication/prompts/clean-message-resume.txt"
split = "train"
families = ["single"]
instruction_level = "guided"
instances_per_template = 1
instance_offset = 6100
seed = 20270118
teacher_conditioned = false
self_contained_child_contract = true

[env.taskset.task]
reward_mode = "causal"
reward_shape = "strict"

[env.agent]
max_turns = 24
max_output_tokens = 16384
max_total_tokens = 65536

[env.agent.harness]
id = "prime-agent"
version = "0.7.0"
save_session = true
max_depth = 1
model_context_window = 32768
autonomous = true
gates = ["python /workspace/.subagent-communication/completion_gate.py"]
autonomous_gate_retries = 12
autonomous_gate_timeout_ms = 10000
autonomous_max_continuations = 12
autonomous_max_turns = 24
autonomous_max_tokens = 65536
autonomous_timeout_ms = 240000

[env.agent.runtime]
type = "docker"
image = "python:3.11-slim"

[env.agent.timeout]
setup = 300.0
rollout = 900.0
finalize = 60.0
scoring = 60.0

[client]
base_url = "http://127.0.0.1:8000/v1"
api_key_var = "PRIME_API_KEY"
type = "eval"

[sampling]
temperature = 0.1
max_tokens = 2048

[sampling.extra_body.chat_template_kwargs]
enable_thinking = false
