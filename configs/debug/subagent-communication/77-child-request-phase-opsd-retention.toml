# Distill the complete child request phase, including responses after IPython output.
# The filter stops after the first successful message receipt, before parent follow-up.

max_steps = 1
seq_len = 32768
max_train_batch_lead = 0
output_dir = "/ephemeral/subagent-rung/outputs/77-child-request-phase-opsd-retention-r1"
clean_output_dir = true

[deployment]
gpus_per_node = 1
num_train_gpus = 1
num_infer_gpus = 0

[weight_broadcast]
type = "filesystem"

[ckpt]
interval = 1
keep_last = 1
keep_interval = 1

[trainer.ckpt]
weights_only = true

[trainer.ckpt.weights]
save_adapter_only = false

[file_monitor]
filename = "metrics.jsonl"

[model]
name = "/ephemeral/subagent-rung/outputs/68-rung37-dense-export-r1/weights/step_1"

[model.vlm]
vision_encoder_attr = "model.visual"
language_model_attr = "model.language_model"
freeze_vision_encoder = true

[trainer.model]
impl = "custom"
optimization_dtype = "bfloat16"
reduce_dtype = "bfloat16"

[trainer.model.ac]
freq = 1

[trainer.optim]
type = "adamw"
lr = 1e-7
max_norm = 1.0

[trainer.sdpo_loss]
distillation_topk = 20
alpha = 1.0
is_clip = 2.0
rollout_is = "token"
rollout_is_threshold = 2.0
teacher_regularization = "live-policy"

[orchestrator]
batch_size = 24
group_size = 1

[orchestrator.algo]
type = "opsd"
demo_key = "demonstrations"

[orchestrator.algo.renderer]
name = "qwen3.5"
enable_thinking = false

[orchestrator.algo.filter]
import_path = "subagent_communication_v1.taskset.keep_child_request_phase_responses"

[orchestrator.renderer]
name = "qwen3.5"
enable_thinking = false

[orchestrator.model.client]
base_url = ["http://127.0.0.1:8000/v1"]
admin_base_url = ["http://127.0.0.1:8100/v1"]

[orchestrator.train.sampling]
temperature = 1.0
max_completion_tokens = 2048

[[orchestrator.train.source]]
name = "prime-agent-guided-child-request-phase-opsd"
ratio = 1
group_size = 1

[orchestrator.train.source.env]
max_concurrent_agents = 2

[orchestrator.train.source.env.retries]
max_retries = 0

[orchestrator.train.source.env.taskset]
id = "subagent-communication-v1"
split = "train"
families = ["followup", "handshake"]
instruction_level = "guided"
instances_per_template = 2
instance_offset = 4400
seed = 20270311
reward_post_fan_in_control = true

[orchestrator.train.source.env.agent]
max_turns = 12
max_output_tokens = 8192
max_total_tokens = 32768

[orchestrator.train.source.env.agent.timeout]
setup = 300.0
rollout = 360.0
finalize = 60.0
scoring = 60.0

[orchestrator.train.source.env.agent.harness]
id = "prime-agent"
version = "0.7.0"
save_session = true
max_depth = 1
model_context_window = 32768
autonomous = true
gates = ["python /workspace/.subagent-communication/completion_gate.py"]
autonomous_gate_retries = 6
autonomous_gate_timeout_ms = 10000
autonomous_max_continuations = 6
autonomous_max_turns = 12
autonomous_max_tokens = 32768
autonomous_timeout_ms = 240000

[orchestrator.train.source.env.agent.runtime]
type = "docker"
image = "python:3.11-slim"

[orchestrator.train.source.serve.pool]
type = "static"
num_workers = 1

[orchestrator.train.source.serve]
max_concurrent = 2

[[orchestrator.train.source]]
name = "prime-agent-rung37-opd-retention"
ratio = 1
group_size = 1

[orchestrator.train.source.algo]
type = "opd"
loss_weight = 0.25

[orchestrator.train.source.algo.teacher]
name = "/ephemeral/subagent-rung/outputs/68-rung37-dense-export-r1/weights/step_1"
base_url = ["http://127.0.0.1:8200/v1"]

[orchestrator.train.source.env]
max_concurrent_agents = 3

[orchestrator.train.source.env.retries]
max_retries = 1

[orchestrator.train.source.env.taskset]
id = "subagent-communication-v1"
split = "train"
families = ["direct", "single", "parallel"]
instruction_level = "standard"
instances_per_template = 2
instance_offset = 4500
seed = 20270313

[orchestrator.train.source.env.agent]
max_turns = 12
max_output_tokens = 8192
max_total_tokens = 32768

[orchestrator.train.source.env.agent.timeout]
setup = 300.0
rollout = 360.0
finalize = 60.0
scoring = 60.0

[orchestrator.train.source.env.agent.harness]
id = "prime-agent"
version = "0.7.0"
save_session = true
max_depth = 1
model_context_window = 32768
autonomous = true
gates = ["python /workspace/.subagent-communication/completion_gate.py"]
autonomous_gate_retries = 6
autonomous_gate_timeout_ms = 10000
autonomous_max_continuations = 6
autonomous_max_turns = 12
autonomous_max_tokens = 32768
autonomous_timeout_ms = 240000

[orchestrator.train.source.env.agent.runtime]
type = "docker"
image = "python:3.11-slim"

[orchestrator.train.source.serve.pool]
type = "static"
num_workers = 1

[orchestrator.train.source.serve]
max_concurrent = 2
