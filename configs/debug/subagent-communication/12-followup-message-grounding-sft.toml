# Ground resumed child computation in the actual parent-message body.

max_steps = 80
output_dir = "/ephemeral/subagent-rung/outputs/12-followup-message-grounding-sft-r1"
clean_output_dir = true

[deployment]
num_gpus = 1

[ckpt]
interval = 40
keep_last = 2
keep_interval = 80

[file_monitor]
filename = "metrics.jsonl"

[model]
name = "/ephemeral/subagent-rung/outputs/08-followup-grpo-r1/weights/step_2"
seq_len = 8192
impl = "custom"
optimization_dtype = "bfloat16"
reduce_dtype = "bfloat16"

[model.vlm]
vision_encoder_attr = "model.visual"
language_model_attr = "model.language_model"
freeze_vision_encoder = true

[model.ac]
freq = 1

[model.lora]
rank = 16
alpha = 32

[data]
name = "/ephemeral/subagent-rung/data/12-followup-message-grounding-sft-r1"
seq_len = 8192
batch_size = 4
micro_batch_size = 1
shuffle = true
seed = 20260907

[renderer]
name = "qwen3.5"
enable_thinking = false

[optim]
lr = 3e-5
