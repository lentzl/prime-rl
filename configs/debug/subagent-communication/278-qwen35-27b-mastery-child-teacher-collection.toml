# Authentic thinking trajectories for child-owned first decisions. Only
# strict verifier successes are eligible for the teacher bootstrap dataset.

model = "Qwen/Qwen3.5-27B"
num_tasks = 8
num_rollouts = 16
shuffle = false
max_concurrent = 2
verbose = false
rich = false
server = false
push = false

[env]
max_concurrent_agents = 2

[env.taskset]
id = "ownership-invariant-v1"
split = "admission"
ownership = "child"
yield_policy = "semantic"
instances_per_family = 1
instance_offset = 20000
seed = 20260815

[env.agent]
max_turns = 8
max_output_tokens = 24576
max_total_tokens = 65536

[env.agent.harness]
id = "prime_agent"
version = "0.7.1"
thinking = "high"

[env.agent.runtime]
type = "docker"
image = "python:3.11-slim"

[env.agent.timeout]
setup = 300.0
rollout = 600.0
finalize = 60.0
scoring = 60.0

[client]
base_url = "http://127.0.0.1:8300/v1"
api_key_var = "PRIME_API_KEY"
type = "eval"

[sampling]
temperature = 1.0
max_tokens = 4096
