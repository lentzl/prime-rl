# Development-only probe for the complete first-turn single-child admission invariant.

model = "qwen35-4b-single-reply-candidate"
num_tasks = 4
num_rollouts = 4
shuffle = false
max_concurrent = 3
verbose = false
rich = false
server = false
push = false
output_dir = "/ephemeral/subagent-rung/evals/qwen35-4b-single-admission-probe"

[env]
max_concurrent_agents = 2

[env.taskset]
id = "subagent-communication-v1"
split = "eval"
families = ["single"]
instruction_level = "guided"
instances_per_template = 1
instance_offset = 5600
seed = 20270503

[env.agent]
max_turns = 2
max_output_tokens = 4096
max_total_tokens = 8192

[env.agent.harness]
id = "prime-agent"
version = "0.7.0"
save_session = true
max_depth = 1
model_context_window = 32768
autonomous = false

[env.agent.runtime]
type = "docker"
image = "python:3.11-slim"

[env.agent.timeout]
setup = 300.0
rollout = 300.0
finalize = 60.0
scoring = 60.0

[client]
base_url = "http://127.0.0.1:8000/v1"
api_key_var = "PRIME_API_KEY"
type = "eval"

[sampling]
temperature = 0.8
max_tokens = 2048
