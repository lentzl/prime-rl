# Two natural 16K-context tasks testing useful REPL externalization.

model = "Qwen/Qwen3.5-27B"
num_tasks = 2
num_rollouts = 1
shuffle = false
max_concurrent = 2
verbose = false
rich = false
server = false
push = false

[env]
max_concurrent_agents = 1

[env.taskset]
id = "oolong-synth-v1"
split = "validation"
context_len = 16384
# Training uses matching validation examples 8-31; begin immediately after it.
example_offset = 32
num_examples = 2

[env.agent]
max_turns = 24
max_input_tokens = 196608
max_output_tokens = 24576
max_total_tokens = 221184

[env.agent.harness]
id = "prime_agent"
version = "0.7.1"
thinking = "high"

[env.agent.runtime]
type = "docker"
image = "python:3.11-slim"

[env.agent.timeout]
setup = 300.0
rollout = 1200.0
finalize = 60.0
scoring = 60.0

[client]
base_url = "http://127.0.0.1:8100/v1"
api_key_var = "PRIME_API_KEY"
type = "eval"

[sampling]
temperature = 0.4
max_tokens = 4096
