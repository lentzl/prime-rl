# One full epoch over the narrow retained-RLM-handle repair set.

max_steps = 32
output_dir = "/ephemeral/subagent-rung/outputs/20-retained-spawn-sft-1epoch-r1"
clean_output_dir = true

[deployment]
num_gpus = 1

[ckpt]
interval = 32
keep_last = 1
keep_interval = 32
weights_only = true

[ckpt.weights]
save_adapter_only = true

[file_monitor]
filename = "metrics.jsonl"

[model]
name = "/ephemeral/subagent-rung/outputs/18-retained-causal-conjunction-grpo-r1/weights/step_1"
seq_len = 8192
impl = "custom"
optimization_dtype = "bfloat16"
reduce_dtype = "bfloat16"

[model.vlm]
vision_encoder_attr = "model.visual"
language_model_attr = "model.language_model"
freeze_vision_encoder = true

[model.ac]
freq = 1

[model.lora]
rank = 16
alpha = 32

[data]
name = "/ephemeral/subagent-rung/data/19-retained-spawn-sft-r1"
seq_len = 8192
batch_size = 4
micro_batch_size = 1
shuffle = true
seed = 20260925

[renderer]
name = "qwen3.5"
enable_thinking = false

[optim]
lr = 4e-6
