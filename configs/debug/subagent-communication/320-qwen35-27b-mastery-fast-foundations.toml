# One deterministic example of every native Prime Agent capability family.

model = "Qwen/Qwen3.5-27B"
num_tasks = 5
num_rollouts = 1
shuffle = false
max_concurrent = 2
verbose = false
rich = false
server = false
push = false

[env]
max_concurrent_agents = 1

[env.taskset]
id = "prime-agent-capabilities-v1"
families = ["ipython_cell", "persistence", "subagent_lifecycle", "harness_state", "killed_child"]
instances_per_family = 1
instance_offset = 16000

[env.agent]
max_turns = 12
max_output_tokens = 12288
max_total_tokens = 32768

[env.agent.harness]
id = "prime_agent"
version = "0.7.1"
thinking = "high"

[env.agent.runtime]
type = "docker"
image = "python:3.11-slim"

[env.agent.timeout]
setup = 300.0
rollout = 600.0
finalize = 60.0
scoring = 60.0

[client]
base_url = "http://127.0.0.1:8100/v1"
api_key_var = "PRIME_API_KEY"
type = "eval"

[sampling]
temperature = 0.4
max_tokens = 4096
