# Three additional OPSD updates from rung 36, checkpointed for dose-response.

max_steps = 3
seq_len = 32768
max_train_batch_lead = 0
output_dir = "/ephemeral/subagent-rung/outputs/37-single-path-opsd-dose-r1"
clean_output_dir = true

[deployment]
gpus_per_node = 1
num_train_gpus = 1
num_infer_gpus = 0

[weight_broadcast]
type = "filesystem"

[ckpt]
interval = 1
keep_last = 3
keep_interval = 1

[trainer.ckpt]
weights_only = true

[trainer.ckpt.weights]
save_adapter_only = true

[file_monitor]
filename = "metrics.jsonl"

[model]
name = "/ephemeral/subagent-rung/outputs/18-retained-causal-conjunction-grpo-r1/weights/step_1"

[model.vlm]
vision_encoder_attr = "model.visual"
language_model_attr = "model.language_model"
freeze_vision_encoder = true

[trainer.model]
impl = "custom"
optimization_dtype = "bfloat16"
reduce_dtype = "bfloat16"

[trainer.model.ac]
freq = 1

[trainer.model.lora]
rank = 16
alpha = 32
init_adapter = "/ephemeral/subagent-rung/outputs/36-single-path-opsd-r1/weights/step_1"

[trainer.optim]
lr = 1e-6

[trainer.sdpo_loss]
teacher_regularization = "live-policy"
distillation_topk = 20
alpha = 1.0

[orchestrator]
batch_size = 4
group_size = 1

[orchestrator.algo]
type = "opsd"
demo_key = "demonstration"

[orchestrator.algo.renderer]
name = "qwen3.5"

[orchestrator.renderer]
name = "qwen3.5"
enable_thinking = false

[orchestrator.model.client]
base_url = ["http://127.0.0.1:8000/v1"]
admin_base_url = ["http://127.0.0.1:8100/v1"]

[orchestrator.train.sampling]
temperature = 1.0
max_completion_tokens = 2048

[[orchestrator.train.source]]
name = "prime-agent-single-path-opsd-dose"

[orchestrator.train.source.env]
max_concurrent_agents = 2

[orchestrator.train.source.env.retries]
max_retries = 1

[orchestrator.train.source.env.taskset]
id = "subagent-communication-v1"
split = "train"
families = ["single"]
instruction_level = "guided"
instances_per_template = 4
instance_offset = 1520
seed = 20261110

[orchestrator.train.source.env.agent]
max_turns = 2
max_output_tokens = 4096
max_total_tokens = 8192

[orchestrator.train.source.env.agent.timeout]
setup = 300.0
rollout = 300.0
finalize = 60.0
scoring = 60.0

[orchestrator.train.source.env.agent.harness]
id = "prime-agent"
version = "0.7.0"
save_session = true
max_depth = 1
model_context_window = 32768
autonomous = false

[orchestrator.train.source.env.agent.runtime]
type = "docker"
image = "python:3.11-slim"

[orchestrator.train.source.serve.pool]
type = "static"
num_workers = 1

[orchestrator.train.source.serve]
max_concurrent = 2
