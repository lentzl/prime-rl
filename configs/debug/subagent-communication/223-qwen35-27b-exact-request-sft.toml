# Teach exact first child requests while retaining complete harness trajectories.

max_steps = 12
output_dir = "/ephemeral/subagent-rung/outputs/223-qwen35-27b-exact-request-sft-r1"
clean_output_dir = true

[deployment]
num_gpus = 2

[ckpt]
interval = 4
keep_last = 3
keep_interval = 12
weights_only = true

[ckpt.weights]
save_adapter_only = true

[file_monitor]
filename = "metrics.jsonl"

[model]
name = "Qwen/Qwen3.5-27B"
seq_len = 12288
impl = "custom"
optimization_dtype = "bfloat16"
reduce_dtype = "bfloat16"

[model.vlm]
vision_encoder_attr = "model.visual"
language_model_attr = "model.language_model"
freeze_vision_encoder = true

[model.ac]
freq = 1

[model.lora]
rank = 16
alpha = 32
init_adapter = "/ephemeral/subagent-rung/outputs/221-qwen35-27b-bidirectional-sft-r1/weights/step_12"

[data]
name = "/ephemeral/subagent-rung/data/223-qwen35-27b-exact-request-sft-r1"
seq_len = 12288
batch_size = 4
micro_batch_size = 1
shuffle = true
seed = 20270202

[renderer]
name = "qwen3.5"
enable_thinking = false

[optim]
lr = 2e-7
