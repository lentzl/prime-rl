# Natural long-context externalization slice of Mastery Battery v1.

model = "Qwen/Qwen3.5-27B"
num_tasks = 8
num_rollouts = 1
shuffle = false
max_concurrent = 2
verbose = false
rich = false
server = false
push = false

[env]
max_concurrent_agents = 1

[env.taskset]
id = "oolong-synth-v1"
split = "validation"
# Leave half of the 32K inference context for the Prime Agent conversation and
# REPL observations. The 32K Oolong bucket needs a larger inference server.
context_len = 16384

[env.agent]
max_turns = 24
# These are cumulative rollout budgets, not per-request context limits.
max_input_tokens = 196608
max_output_tokens = 24576
max_total_tokens = 221184

[env.agent.harness]
id = "prime_agent"
version = "0.7.1"
thinking = "high"

[env.agent.runtime]
type = "docker"
image = "python:3.11-slim"

[env.agent.timeout]
setup = 300.0
rollout = 1200.0
finalize = 60.0
scoring = 60.0

[client]
# Router 0.1.26 rejects Prime Agent's OpenAI `developer` role; vLLM accepts it.
base_url = "http://127.0.0.1:8100/v1"
api_key_var = "PRIME_API_KEY"
type = "eval"

[sampling]
temperature = 0.4
max_tokens = 4096
