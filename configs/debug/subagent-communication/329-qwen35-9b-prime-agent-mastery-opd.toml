rollout = 600.0
finalize = 60.0
scoring = 60.0

[[orchestrator.train.source]]
name = "mastery-communication-opd"
ratio = 1.0
group_size = 1

[orchestrator.train.source.env]
max_concurrent_agents = 3

[orchestrator.train.source.env.retries]
max_retries = 0

[orchestrator.train.source.env.taskset]
id = "subagent-communication-v1"
split = "train"
families = ["direct", "single", "parallel", "followup", "handshake"]
instruction_level = "standard"
prompt_contract = "explicit_bidirectional_v2"
instances_per_template = 16
instance_offset = 20300
seed = 20260817
reward_post_fan_in_control = true
reward_bidirectional_control = true

[orchestrator.train.source.env.agent]
max_turns = 24
max_output_tokens = 24576
max_total_tokens = 65536

[orchestrator.train.source.env.agent.harness]
id = "prime_agent"
version = "0.7.1"
thinking = "high"
autonomous = true
gates = ["python /workspace/.subagent-communication/completion_gate.py"]

[orchestrator.train.source.env.agent.runtime]
type = "docker"
image = "python:3.11-slim"

[orchestrator.train.source.env.agent.timeout]
setup = 300.0
rollout = 1200.0
finalize = 60.0
scoring = 60.0

[[orchestrator.train.source]]
name = "mastery-externalization-opd"
ratio = 1.0
group_size = 1

[orchestrator.train.source.env]
max_concurrent_agents = 1

[orchestrator.train.source.env.retries]
max_retries = 0

[orchestrator.train.source.env.taskset]
id = "oolong-synth-v1"
split = "validation"
context_len = 16384
example_offset = 40
num_examples = 24

[orchestrator.train.source.env.agent]
max_turns = 24
max_input_tokens = 65536
max_output_tokens = 24576
max_total_tokens = 98304

[orchestrator.train.source.env.agent.harness]
id = "prime_agent"
version = "0.7.1"
thinking = "high"

[orchestrator.train.source.env.agent.runtime]
type = "docker"
image = "python:3.11-slim"

[orchestrator.train.source.env.agent.timeout]
setup = 300.0
rollout = 1200.0
finalize = 60.0
scoring = 60.0

[inference]
router = "None"
backend_port = 8100

[inference.server]
port = 8000

[inference.vllm]
tensor_parallel_size = 1
max_model_len = 65536
tool_call_parser = "qwen3_coder"
reasoning_parser = "qwen3"
gpu_memory_utilization = 0.82
max_num_seqs = 4
mamba_ssm_cache_dtype = "float32"

[inference.weight_broadcast]
type = "filesystem"
