# Diverse low-temperature collection of executable Prime Agent message trajectories.

model = "Qwen/Qwen3.5-9B"
num_tasks = 8
num_rollouts = 2
shuffle = false
max_concurrent = 1
verbose = false
rich = false
server = false
push = false
output_dir = "/ephemeral/subagent-rung/evals/169-qwen35-9b-executable-message-collection"

[env]
max_concurrent_agents = 2

[env.retries]
max_retries = 1

[env.taskset]
id = "subagent-admission-v1"
system_prompt = "configs/debug/subagent-communication/prompts/clean-message-resume.txt"
split = "train"
families = ["single"]
instruction_level = "guided"
instances_per_template = 2
instance_offset = 4000
seed = 20261217
teacher_conditioned = true
self_contained_child_contract = true

[env.taskset.task]
reward_mode = "causal"
reward_shape = "strict"

[env.agent]
max_turns = 24
max_output_tokens = 16384
max_total_tokens = 65536

[env.agent.harness]
id = "prime-agent"
version = "0.7.0"
save_session = true
max_depth = 1
model_context_window = 32768
autonomous = false

[env.agent.runtime]
type = "docker"
image = "python:3.11-slim"

[env.agent.timeout]
setup = 300.0
rollout = 900.0
finalize = 60.0
scoring = 60.0

[client]
base_url = "http://127.0.0.1:8000/v1"
api_key_var = "PRIME_API_KEY"
type = "eval"

[sampling]
temperature = 0.1
max_tokens = 2048

[sampling.extra_body.chat_template_kwargs]
enable_thinking = false
