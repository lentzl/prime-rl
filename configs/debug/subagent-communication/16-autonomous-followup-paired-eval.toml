# Matched held-out diagnostic for comparing autonomous follow-up checkpoints.

model = "/ephemeral/subagent-rung/outputs/15-autonomous-followup-grpo-r1/weights/step_1"
num_tasks = 1
num_rollouts = 2
shuffle = false
max_concurrent = 1
verbose = false
rich = false
server = false
push = false
output_dir = "/ephemeral/subagent-rung/evals/rung15-step1-autonomous-followup-paired-r1"

[env]
max_concurrent_agents = 1

[env.taskset]
id = "subagent-communication-v1"
split = "eval"
families = ["followup"]
instruction_level = "guided"
instances_per_template = 1
instance_offset = 610
seed = 20260922

[env.agent]
max_turns = 20
max_output_tokens = 16384
max_total_tokens = 65536

[env.agent.harness]
id = "prime-agent"
version = "0.7.0"
save_session = true
max_depth = 1
model_context_window = 32768
autonomous = true
gates = ["python /workspace/.subagent-communication/completion_gate.py"]
autonomous_gate_retries = 12
autonomous_gate_timeout_ms = 10000
autonomous_max_continuations = 12
autonomous_max_turns = 20
autonomous_max_tokens = 65536
autonomous_timeout_ms = 240000

[env.agent.runtime]
type = "docker"
image = "python:3.11-slim"

[env.agent.timeout]
setup = 300.0
rollout = 360.0
finalize = 60.0
scoring = 60.0

[client]
base_url = "http://127.0.0.1:8000/v1"
api_key_var = "PRIME_API_KEY"
type = "eval"

[sampling]
temperature = 0.8
max_tokens = 2048
