# Held-out initial-action gate for the lowest-loss OPSD dose checkpoint.

model = "rung37-step2"
num_tasks = 1
num_rollouts = 5
shuffle = false
max_concurrent = 5
verbose = false
rich = false
server = false
push = false
output_dir = "/ephemeral/subagent-rung/evals/rung37-step2-initial-spawn-r1"

[env]
max_concurrent_agents = 5

[env.taskset]
id = "subagent-communication-v1"
split = "eval"
families = ["single"]
instruction_level = "guided"
instances_per_template = 1
instance_offset = 1400
seed = 20261101

[env.agent]
max_turns = 2
max_output_tokens = 4096
max_total_tokens = 8192

[env.agent.harness]
id = "prime-agent"
version = "0.7.0"
save_session = true
max_depth = 1
model_context_window = 32768
autonomous = false

[env.agent.runtime]
type = "docker"
image = "python:3.11-slim"

[env.agent.timeout]
setup = 300.0
rollout = 300.0
finalize = 60.0
scoring = 60.0

[client]
base_url = "http://127.0.0.1:8000/v1"
api_key_var = "PRIME_API_KEY"
type = "eval"

[sampling]
temperature = 0.8
max_tokens = 2048
