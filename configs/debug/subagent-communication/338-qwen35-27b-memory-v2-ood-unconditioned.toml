# Frozen balanced semantic-OOD admission arm without a demonstration (v2).

model = "Qwen/Qwen3.5-27B"
num_tasks = 8
num_rollouts = 2
shuffle = false
max_concurrent = 2
verbose = false
rich = false
server = false
push = false

[env]
max_concurrent_agents = 1

[env.taskset]
id = "programmatic-episodic-memory-v2"
dataset_path = "/ephemeral/subagent-rung/data/programmatic-episodic-memory-v2/semantic_ood.jsonl"
split = "semantic_ood"
condition_on_demonstration = false
instance_offset = 9
instances_per_family = 1

[env.agent]
max_turns = 8
max_output_tokens = 8192
max_total_tokens = 24576

[env.agent.harness]
id = "prime_agent"
version = "0.7.1"
thinking = "high"

[env.agent.runtime]
type = "docker"
image = "python:3.11-slim"

[env.agent.timeout]
setup = 300.0
rollout = 600.0
finalize = 60.0
scoring = 60.0

[client]
base_url = "http://127.0.0.1:8100/v1"
api_key_var = "PRIME_API_KEY"
type = "train"
renderer_model_name = "Qwen/Qwen3.5-27B"

[client.renderer]
name = "qwen3.5"
enable_thinking = true

[sampling]
temperature = 0.4
max_tokens = 4096
