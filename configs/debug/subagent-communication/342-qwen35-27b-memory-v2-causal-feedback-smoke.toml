# Four-family executable smoke for bounded causal memory feedback.

model = "Qwen/Qwen3.5-27B"
num_tasks = 4
num_rollouts = 1
shuffle = false
max_concurrent = 2
verbose = false
rich = false
server = false
push = false

[env]
max_concurrent_agents = 1

[env.taskset]
id = "programmatic-episodic-memory-v2"
dataset_path = "/ephemeral/subagent-rung/data/programmatic-episodic-memory-v2/familiar_heldout.jsonl"
split = "familiar_heldout"
families = ["correction_aggregate", "repeated_lookup_index", "prompt_override_control", "research_retraction"]
instance_offset = 10
instances_per_family = 1
causal_feedback_retries = 1

[env.taskset.task]
reward_shape = "dense"

[env.agent]
max_turns = 12
max_output_tokens = 12288
max_total_tokens = 32768

[env.agent.harness]
id = "prime_agent"
version = "0.7.1"
thinking = "high"

[env.agent.runtime]
type = "docker"
image = "python:3.11-slim"

[env.agent.timeout]
setup = 300.0
rollout = 600.0
finalize = 60.0
scoring = 60.0

[client]
base_url = "http://127.0.0.1:8100/v1"
api_key_var = "PRIME_API_KEY"
type = "eval"

[sampling]
temperature = 0.4
max_tokens = 4096
