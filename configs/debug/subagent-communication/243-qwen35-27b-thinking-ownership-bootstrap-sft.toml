# One thinking-preserving epoch over the coordinator ownership/spawn decision.

max_steps = 1
output_dir = "/ephemeral/subagent-rung/outputs/243-qwen35-27b-thinking-ownership-bootstrap-sft-r1"
clean_output_dir = true

[deployment]
num_gpus = 2

[ckpt]
interval = 1
keep_last = 1
keep_interval = 1
weights_only = true

[ckpt.weights]
save_adapter_only = true

[file_monitor]
filename = "metrics.jsonl"

[model]
name = "Qwen/Qwen3.5-27B"
seq_len = 8192
impl = "custom"
optimization_dtype = "bfloat16"
reduce_dtype = "bfloat16"

[model.vlm]
vision_encoder_attr = "model.visual"
language_model_attr = "model.language_model"
freeze_vision_encoder = true

[model.ac]
freq = 1

[model.lora]
rank = 16
alpha = 32

[data]
name = "/ephemeral/subagent-rung/data/243-qwen35-27b-thinking-ownership-bootstrap-sft-r1"
seq_len = 8192
batch_size = 4
micro_batch_size = 1
shuffle = true
seed = 20270221

[renderer]
name = "qwen3.5"
enable_thinking = true

[optim]
lr = 1e-7
