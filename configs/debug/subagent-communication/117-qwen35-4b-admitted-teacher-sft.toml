# One conservative epoch over strictly admitted natural parent/child trajectories.

max_steps = 4
output_dir = "/ephemeral/subagent-rung/outputs/117-qwen35-4b-admitted-teacher-sft-r1"
clean_output_dir = true

[deployment]
num_gpus = 1

[ckpt]
interval = 2
keep_last = 2
keep_interval = 4
weights_only = true

[ckpt.weights]
save_adapter_only = true

[file_monitor]
filename = "metrics.jsonl"

[model]
name = "Qwen/Qwen3.5-4B"
seq_len = 12288
impl = "custom"
optimization_dtype = "bfloat16"
reduce_dtype = "bfloat16"

[model.vlm]
vision_encoder_attr = "model.visual"
language_model_attr = "model.language_model"
freeze_vision_encoder = true

[model.ac]
freq = 1

[model.lora]
rank = 16
alpha = 32
init_adapter = "/ephemeral/subagent-rung/outputs/100-qwen35-4b-single-admission-sft-r1/weights/step_8"

[data]
name = "/ephemeral/subagent-rung/data/117-qwen35-4b-admitted-teacher-sft-r1"
seq_len = 12288
batch_size = 4
micro_batch_size = 1
shuffle = true
seed = 20261007

[renderer]
name = "qwen3.5"
enable_thinking = false

[optim]
lr = 5e-7
