# Four low-rate OPSD updates on the coordinator's first response only.

max_steps = 4
seq_len = 8192
max_train_batch_lead = 0
output_dir = "/ephemeral/subagent-rung/outputs/209-qwen35-4b-first-response-opsd-r2"
clean_output_dir = true

[deployment]
gpus_per_node = 1
num_train_gpus = 1
num_infer_gpus = 0

[weight_broadcast]
type = "filesystem"

[ckpt]
interval = 1
keep_last = 4
keep_interval = 4

[trainer.ckpt]
weights_only = true

[trainer.ckpt.weights]
save_adapter_only = true

[file_monitor]
filename = "metrics.jsonl"

[model]
name = "Qwen/Qwen3.5-4B"

[model.vlm]
vision_encoder_attr = "model.visual"
language_model_attr = "model.language_model"
freeze_vision_encoder = true

[trainer.model]
impl = "custom"
optimization_dtype = "bfloat16"
reduce_dtype = "bfloat16"

[trainer.model.ac]
freq = 1

[trainer.model.lora]
rank = 16
alpha = 32
init_adapter = "/ephemeral/subagent-rung/outputs/100-qwen35-4b-single-admission-sft-r1/weights/step_8"

[trainer.optim]
type = "adamw"
lr = 2e-7
max_norm = 1.0

[trainer.sdpo_loss]
distillation_topk = 20
alpha = 1.0
is_clip = 2.0
rollout_is = "token"
rollout_is_threshold = 2.0
teacher_regularization = "live-policy"

[orchestrator]
batch_size = 4
group_size = 1

[orchestrator.algo]
type = "opsd"
demo_key = "coordinator_demonstrations"

[orchestrator.algo.renderer]
name = "qwen3.5"
enable_thinking = false

[orchestrator.algo.filter]
import_path = "subagent_communication_v1.taskset.keep_first_coordinator_response"

[orchestrator.renderer]
name = "qwen3.5"
enable_thinking = false

[orchestrator.model.client]
base_url = ["http://127.0.0.1:8000/v1"]
admin_base_url = ["http://127.0.0.1:8100/v1"]

[orchestrator.train.sampling]
temperature = 1.0
max_completion_tokens = 1024

[[orchestrator.train.source]]
name = "prime-agent-single-first-response-opsd"
group_size = 1

[orchestrator.train.source.env]
max_concurrent_agents = 2

[orchestrator.train.source.env.retries]
max_retries = 1

[orchestrator.train.source.env.taskset]
id = "subagent-admission-v1"
system_prompt = "configs/debug/subagent-communication/prompts/clean-message-resume.txt"
split = "train"
families = ["single"]
instruction_level = "guided"
instances_per_template = 1
instance_offset = 6500
seed = 20270120
teacher_conditioned = false
self_contained_child_contract = true

[orchestrator.train.source.env.taskset.task]
reward_mode = "clean_causal"
reward_shape = "strict"

[orchestrator.train.source.env.agent]
max_turns = 1
max_output_tokens = 2048
max_total_tokens = 8192

[orchestrator.train.source.env.agent.timeout]
setup = 300.0
rollout = 600.0
finalize = 60.0
scoring = 60.0

[orchestrator.train.source.env.agent.harness]
id = "prime-agent"
version = "0.7.0"
save_session = true
max_depth = 1
model_context_window = 32768
autonomous = true
gates = ["python /workspace/.subagent-communication/completion_gate.py"]
autonomous_gate_retries = 1
autonomous_gate_timeout_ms = 10000
autonomous_max_continuations = 1
autonomous_max_turns = 1
autonomous_max_tokens = 8192
autonomous_timeout_ms = 180000

[orchestrator.train.source.env.agent.runtime]
type = "docker"
image = "python:3.11-slim"

[orchestrator.train.source.serve.pool]
type = "static"
num_workers = 1

[orchestrator.train.source.serve]
max_concurrent = 2
