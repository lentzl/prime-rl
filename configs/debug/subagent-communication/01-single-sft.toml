# Seed native single-child admission and explicit child-to-parent replies.

max_steps = 24
output_dir = "/ephemeral/subagent-rung/outputs/01-single-sft"
clean_output_dir = true

[deployment]
num_gpus = 1

[ckpt]
interval = 12
keep_last = 2
keep_interval = 24

[file_monitor]
filename = "metrics.jsonl"

[model]
name = "/ephemeral/models/qwen35-file-processing-r1"
seq_len = 8192
impl = "custom"
optimization_dtype = "bfloat16"
reduce_dtype = "bfloat16"

[model.vlm]
vision_encoder_attr = "model.visual"
language_model_attr = "model.language_model"
freeze_vision_encoder = true

[model.ac]
freq = 1

[model.lora]
rank = 16
alpha = 32

[data]
name = "/ephemeral/subagent-rung/data/01-single-sft"
seq_len = 8192
batch_size = 4
micro_batch_size = 1
shuffle = true
seed = 20260809

[renderer]
name = "qwen3.5"
enable_thinking = false

[optim]
lr = 5e-5
