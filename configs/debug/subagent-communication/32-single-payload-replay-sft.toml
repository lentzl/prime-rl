# Restore literal single-child payloads without discarding the parallel GRPO gain.

max_steps = 20
output_dir = "/ephemeral/subagent-rung/outputs/32-single-payload-replay-sft-r1"
clean_output_dir = true

[deployment]
num_gpus = 1

[ckpt]
interval = 10
keep_last = 2
keep_interval = 10
weights_only = true

[ckpt.weights]
save_adapter_only = true

[file_monitor]
filename = "metrics.jsonl"

[model]
name = "/ephemeral/subagent-rung/outputs/18-retained-causal-conjunction-grpo-r1/weights/step_1"
seq_len = 8192
impl = "custom"
optimization_dtype = "bfloat16"
reduce_dtype = "bfloat16"

[model.vlm]
vision_encoder_attr = "model.visual"
language_model_attr = "model.language_model"
freeze_vision_encoder = true

[model.ac]
freq = 1

[model.lora]
rank = 16
alpha = 32
init_adapter = "/ephemeral/subagent-rung/outputs/30-initialized-parallel-grpo-r1/weights/step_1"

[data]
name = "/ephemeral/subagent-rung/data/32-single-payload-replay-sft-r1"
seq_len = 8192
batch_size = 4
micro_batch_size = 1
shuffle = true
seed = 20261103

[renderer]
name = "qwen3.5"
enable_thinking = false

[optim]
lr = 1e-6
