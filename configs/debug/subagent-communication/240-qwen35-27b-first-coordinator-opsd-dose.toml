# One focused OPSD repair of the coordinator's initial ownership decision.
# Later parent and child transitions receive zero training weight.

max_steps = 1
seq_len = 16384
max_train_batch_lead = 0
output_dir = "/ephemeral/subagent-rung/outputs/240-qwen35-27b-first-coordinator-opsd-dose-r1"
clean_output_dir = true

[deployment]
gpus_per_node = 2
num_train_gpus = 2
num_infer_gpus = 0

[weight_broadcast]
type = "filesystem"

[ckpt]
interval = 1
keep_last = 1
keep_interval = 1

[trainer.ckpt]
weights_only = true

[trainer.ckpt.weights]
save_adapter_only = true

[file_monitor]
filename = "metrics.jsonl"

[model]
name = "Qwen/Qwen3.5-27B"

[model.vlm]
vision_encoder_attr = "model.visual"
language_model_attr = "model.language_model"
freeze_vision_encoder = true

[trainer.model]
impl = "custom"
optimization_dtype = "bfloat16"
reduce_dtype = "bfloat16"

[trainer.model.ac]
freq = 1

[trainer.model.lora]
rank = 16
alpha = 32

[trainer.optim]
type = "adamw"
lr = 1e-7
max_norm = 1.0

[trainer.sdpo_loss]
distillation_topk = 20
alpha = 1.0
is_clip = 2.0
rollout_is = "token"
rollout_is_threshold = 2.0
teacher_regularization = "live-policy"

[orchestrator]
batch_size = 8
group_size = 1

[orchestrator.algo]
type = "opsd"
demo_key = "turn_demonstrations"

[orchestrator.algo.renderer]
name = "qwen3.5"
enable_thinking = true

[orchestrator.algo.filter]
import_path = "subagent_communication_v1.taskset.keep_first_coordinator_response"

[orchestrator.renderer]
name = "qwen3.5"
enable_thinking = true

[orchestrator.model.client]
base_url = ["http://127.0.0.1:8000/v1"]
admin_base_url = ["http://127.0.0.1:8100/v1"]

[orchestrator.train.sampling]
temperature = 1.0
max_completion_tokens = 4096

[[orchestrator.train.source]]
name = "prime-agent-27b-first-coordinator-opsd-followup"
group_size = 1

[orchestrator.train.source.env]
max_concurrent_agents = 2

[orchestrator.train.source.env.retries]
max_retries = 0

[orchestrator.train.source.env.taskset]
id = "subagent-communication-v1"
split = "train"
families = ["followup"]
instruction_level = "standard"
prompt_contract = "explicit_bidirectional_v2"
instances_per_template = 8
instance_offset = 9800
seed = 20270218
reward_bidirectional_control = true

[orchestrator.train.source.env.agent]
max_turns = 24
max_output_tokens = 24576
max_total_tokens = 98304

[orchestrator.train.source.env.agent.timeout]
setup = 300.0
rollout = 1200.0
finalize = 60.0
scoring = 60.0

[orchestrator.train.source.env.agent.harness]
id = "prime-agent"
version = "0.7.0"
save_session = true
max_depth = 1
model_context_window = 32768
autonomous = true
gates = ["python /workspace/.subagent-communication/completion_gate.py"]
autonomous_gate_retries = 12
autonomous_gate_timeout_ms = 10000
autonomous_max_continuations = 12
autonomous_max_turns = 24
autonomous_max_tokens = 98304
autonomous_timeout_ms = 300000

[orchestrator.train.source.env.agent.runtime]
type = "docker"
image = "python:3.11-slim"

[orchestrator.train.source.serve.pool]
type = "static"
num_workers = 1

[orchestrator.train.source.serve]
max_concurrent = 2
