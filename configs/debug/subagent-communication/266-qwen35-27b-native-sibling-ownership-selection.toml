# Frozen 32-task held-out-phrasing ownership/direct screen for Run 265.

model = "Qwen/Qwen3.5-27B"
num_tasks = 16
num_rollouts = 1
shuffle = false
max_concurrent = 4
verbose = false
rich = false
server = false
push = false

[env]
max_concurrent_agents = 2

[env.retries]
max_retries = 0

[env.taskset]
id = "ownership-invariant-v1"
split = "heldout_phrasing"
ownership = "child"
yield_policy = "semantic"
instances_per_family = 2
instance_offset = 12000
seed = 20260815

[env.taskset.task]
yield_policy = "semantic"

[env.agent]
max_turns = 2
max_output_tokens = 8192
max_total_tokens = 16384

[env.agent.timeout]
setup = 300.0
rollout = 300.0
finalize = 60.0
scoring = 60.0

[env.agent.harness]
id = "prime-agent"
version = "0.7.0"
save_session = true
max_depth = 1
model_context_window = 32768
autonomous = false

[env.agent.runtime]
type = "docker"
image = "python:3.11-slim"

[client]
base_url = "http://127.0.0.1:8000/v1"
api_key_var = "PRIME_API_KEY"
type = "eval"

[sampling]
temperature = 0.4
max_tokens = 4096

[sampling.extra_body.chat_template_kwargs]
enable_thinking = true
