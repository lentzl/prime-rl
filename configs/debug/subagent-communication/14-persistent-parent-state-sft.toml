# Focused low-rate repair of the asynchronous follow-up state boundary.

max_steps = 16
output_dir = "/ephemeral/subagent-rung/outputs/14-persistent-parent-state-sft-r1"
clean_output_dir = true

[deployment]
num_gpus = 1

[ckpt]
interval = 8
keep_last = 2
keep_interval = 16

[file_monitor]
filename = "metrics.jsonl"

[model]
name = "/ephemeral/subagent-rung/outputs/13-native-message-control-sft-r1/weights/step_16"
seq_len = 8192
impl = "custom"
optimization_dtype = "bfloat16"
reduce_dtype = "bfloat16"

[model.vlm]
vision_encoder_attr = "model.visual"
language_model_attr = "model.language_model"
freeze_vision_encoder = true

[model.ac]
freq = 1

[model.lora]
rank = 16
alpha = 32

[data]
name = "/ephemeral/subagent-rung/data/14-persistent-parent-state-sft-r1"
seq_len = 8192
batch_size = 4
micro_batch_size = 1
shuffle = true
seed = 20260918

[renderer]
name = "qwen3.5"
enable_thinking = false

[optim]
lr = 4e-6
