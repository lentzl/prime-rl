# Isolate explicit child reply and event-driven parent resume from the selected 4B adapter.

max_steps = 12
output_dir = "/ephemeral/subagent-rung/outputs/94-qwen35-4b-single-reply-control-r1"
clean_output_dir = true

[deployment]
num_gpus = 1

[ckpt]
interval = 4
keep_last = 3
keep_interval = 12
weights_only = true

[ckpt.weights]
save_adapter_only = true

[file_monitor]
filename = "metrics.jsonl"

[model]
name = "Qwen/Qwen3.5-4B"
seq_len = 8192
impl = "custom"
optimization_dtype = "bfloat16"
reduce_dtype = "bfloat16"

[model.vlm]
vision_encoder_attr = "model.visual"
language_model_attr = "model.language_model"
freeze_vision_encoder = true

[model.ac]
freq = 1

[model.lora]
rank = 16
alpha = 32
init_adapter = "/ephemeral/subagent-rung/outputs/90-qwen35-4b-single-sft-low-rate-r1/weights/step_4"

[data]
name = "/ephemeral/subagent-rung/data/94-qwen35-4b-single-reply-control-r1"
seq_len = 8192
batch_size = 4
micro_batch_size = 1
shuffle = true
seed = 20260811

[renderer]
name = "qwen3.5"
enable_thinking = false

[optim]
lr = 2e-6
