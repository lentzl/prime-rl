# Single predeclared low-rate dose after Run 264 passed the zero-LR audit.
# This changes only experiment identity, output path, and learning rate.

max_steps = 1
seq_len = 16384
max_train_batch_lead = 0
output_dir = "/ephemeral/subagent-rung/outputs/265-qwen35-27b-native-sibling-sdpo-dose-r1"
clean_output_dir = true

[deployment]
gpus_per_node = 2
num_train_gpus = 2
num_infer_gpus = 0

[weight_broadcast]
type = "filesystem"

[ckpt]
interval = 1
keep_last = 1
keep_interval = 1

[trainer]
enable_token_export = true

[trainer.ckpt]
weights_only = true

[trainer.ckpt.weights]
save_adapter_only = true

[file_monitor]
filename = "metrics.jsonl"

[model]
name = "Qwen/Qwen3.5-27B"

[model.vlm]
vision_encoder_attr = "model.visual"
language_model_attr = "model.language_model"
freeze_vision_encoder = true

[trainer.model]
impl = "custom"
optimization_dtype = "bfloat16"
reduce_dtype = "bfloat16"

[trainer.model.ac]
freq = 1

[trainer.model.lora]
rank = 16
alpha = 32

[trainer.optim]
type = "adamw"
lr = 1e-7
max_norm = 1.0

[trainer.sdpo_loss]
distillation_topk = 20
alpha = 1.0
is_clip = 2.0
rollout_is = "token"
rollout_is_threshold = 2.0
teacher_regularization = "live-policy"

[orchestrator]
batch_size = 80
group_size = 16

[orchestrator.algo]
type = "sdpo"
success_reward_threshold = 1.0
dont_reprompt_on_self_success = true
remove_thinking_from_demonstration = false
include_environment_feedback = false
environment_feedback_only_without_solution = true
multi_turn_replay = false

[orchestrator.algo.renderer]
name = "qwen3.5"
enable_thinking = true

[orchestrator.algo.filter]
import_path = "subagent_communication_v1.taskset.keep_first_coordinator_tool_call"

[orchestrator.renderer]
name = "qwen3.5"
enable_thinking = true

[orchestrator.model.client]
base_url = ["http://127.0.0.1:8000/v1"]
admin_base_url = ["http://127.0.0.1:8100/v1"]

[orchestrator.train.sampling]
temperature = 1.0
max_completion_tokens = 4096

[[orchestrator.train.source]]
name = "prime-agent-27b-native-sibling-sdpo-dose"
group_size = 16
task_indices = [0, 2, 3, 7, 1]

[orchestrator.train.source.env]
max_concurrent_agents = 2

[orchestrator.train.source.env.retries]
max_retries = 0

[orchestrator.train.source.env.taskset]
id = "ownership-invariant-v1"
split = "admission"
ownership = "child"
yield_policy = "semantic"
instances_per_family = 1
instance_offset = 0
seed = 20260813

[orchestrator.train.source.env.taskset.task]
yield_policy = "semantic"

[orchestrator.train.source.env.agent]
max_turns = 2
max_output_tokens = 8192
max_total_tokens = 16384

[orchestrator.train.source.env.agent.timeout]
setup = 300.0
rollout = 300.0
finalize = 60.0
scoring = 60.0

[orchestrator.train.source.env.agent.harness]
id = "prime-agent"
version = "0.7.0"
save_session = true
max_depth = 1
model_context_window = 32768
autonomous = false

[orchestrator.train.source.env.agent.runtime]
type = "docker"
image = "python:3.11-slim"

[orchestrator.train.source.serve.pool]
type = "static"
num_workers = 1

[orchestrator.train.source.serve]
max_concurrent = 8
