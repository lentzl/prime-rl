# First broad on-policy mastery tranche. The five executable sources exercise the
# coupled Prime Agent policy; strict held-out gates, not train reward, select it.

max_steps = 8
seq_len = 16384
output_dir = "/ephemeral/subagent-rung/outputs/316-qwen35-27b-prime-agent-mastery-grpo-r64"
clean_output_dir = true

[deployment]
gpus_per_node = 4
num_train_gpus = 2
num_infer_gpus = 2

[ckpt]
interval = 2
keep_last = 4
keep_interval = 2

[trainer.ckpt]
weights_only = false

[trainer.ckpt.weights]
save_adapter_separately = true

[file_monitor]
filename = "metrics.jsonl"

[model]
name = "Qwen/Qwen3.5-27B"
revision = "fc05daec18b0a78c049392ed2e771dde82bdf654"

[model.vlm]
vision_encoder_attr = "model.visual"
language_model_attr = "model.language_model"
freeze_vision_encoder = true

[trainer.model]
impl = "custom"
optimization_dtype = "bfloat16"
reduce_dtype = "bfloat16"
optim_cpu_offload = true
reshard_after_forward = true
fused_lm_head_token_chunk_size = 1024

[trainer.model.ac]
mode = "full"
freq = 1

[trainer.model.ac_offloading]
pin_memory = true
max_inflight_activations = 5

[trainer.model.lora]
rank = 64
alpha = 128
target_modules = [
  "q_proj",
  "k_proj",
  "v_proj",
  "o_proj",
  "gate_proj",
  "up_proj",
  "down_proj",
  'linear_attn\.(in_proj_qkv|in_proj_z|in_proj_b|in_proj_a|out_proj)$',
]

[trainer.optim]
type = "adamw"
lr = 5e-7
max_norm = 1.0

[orchestrator]
batch_size = 24
group_size = 4
oversampling_factor = 2.0
max_off_policy_steps = 0

[orchestrator.algo]
type = "grpo"

[orchestrator.algo.length_penalty]
type = "linear"
num_output_tokens_weight = 0.10
num_input_tokens_weight = 0.02
num_turns_weight = 0.10

[orchestrator.renderer]
name = "qwen3.5"
enable_thinking = true

[orchestrator.train.sampling]
temperature = 0.8
max_completion_tokens = 4096

[[orchestrator.train.source]]
name = "mastery-foundations-train"
ratio = 1.0
group_size = 4

[orchestrator.train.source.env]
max_concurrent_agents = 2

[orchestrator.train.source.env.retries]
max_retries = 0

[orchestrator.train.source.env.taskset]
id = "prime-agent-capabilities-v1"
families = ["ipython_cell", "persistence", "subagent_lifecycle", "harness_state", "killed_child"]
instances_per_family = 16
instance_offset = 100

[orchestrator.train.source.env.agent]
max_turns = 12
max_output_tokens = 12288
max_total_tokens = 32768

[orchestrator.train.source.env.agent.harness]
id = "prime_agent"
version = "0.7.1"
thinking = "high"

[orchestrator.train.source.env.agent.runtime]
type = "docker"
image = "python:3.11-slim"

[orchestrator.train.source.env.agent.timeout]
setup = 300.0
rollout = 600.0
finalize = 60.0
scoring = 60.0

[[orchestrator.train.source]]
name = "mastery-ownership-child-train"
ratio = 1.0
group_size = 4

[orchestrator.train.source.env]
max_concurrent_agents = 2

[orchestrator.train.source.env.retries]
max_retries = 0

[orchestrator.train.source.env.taskset]
id = "ownership-invariant-v1"
split = "admission"
ownership = "child"
yield_policy = "semantic"
instruction_level = "standard"
instances_per_family = 16
instance_offset = 100
seed = 20260816

[orchestrator.train.source.env.taskset.task]
yield_policy = "semantic"
reward_shape = "dense"

[orchestrator.train.source.env.agent]
max_turns = 8
max_output_tokens = 12288
max_total_tokens = 32768

[orchestrator.train.source.env.agent.harness]
id = "prime_agent"
version = "0.7.1"
thinking = "high"
autonomous = false

[orchestrator.train.source.env.agent.runtime]
type = "docker"
image = "python:3.11-slim"

[orchestrator.train.source.env.agent.timeout]
setup = 300.0
rollout = 600.0
finalize = 60.0
scoring = 60.0

