# Full-parameter AdamW variant of the RLM-shaped OPSD orientation run.
# This keeps the successful orientation setup but removes LoRA and uses BF16
# trainer/inference dtypes plus optimizer CPU offload to reduce GPU pressure.
#   WANDB_MODE=offline PYTHONPATH=tests/fixtures uv run rl @ configs/debug/algorithms/opsd_rlm_harness_orientation_full_adamw_bf16.toml

max_steps = 80
seq_len = 2048

[model]
name = "Qwen/Qwen3-4B-Instruct-2507"

[wandb]
project = "algorithms-debug"
name = "opsd-rlm-harness-orientation-full-adamw-bf16"

[orchestrator]
batch_size = 4
group_size = 1

[orchestrator.algo]
type = "opsd"
model = "policy"
demo_key = "answer"
multi_turn = true
template_target = "first_user"
max_concurrent = 4
template = "{question}\n\nReference harness demonstration:\n{demonstration}\n\nContinue from the current episode state."

[orchestrator.renderer]
name = "qwen3"
enable_thinking = false
preserve_all_thinking = false

[orchestrator.train.sampling]
temperature = 0.7
max_completion_tokens = 96

[orchestrator.train.sampling.extra_body]
top_k = -1
min_p = 0.0
chat_template_kwargs = { enable_thinking = false }

[[orchestrator.train.env]]
id = "opsd-rlm-harness-orientation"

[[orchestrator.post_batch_filters]]
type = "zero_advantage"
enforce = false

[trainer.optim]
type = "adamw"
lr = 1e-6

[trainer.model]
optimization_dtype = "bfloat16"
reduce_dtype = "bfloat16"
optim_cpu_offload = true

[ckpt]

[inference]
gpu_memory_utilization = 0.45

[inference.model]
dtype = "bfloat16"
max_model_len = 4096
